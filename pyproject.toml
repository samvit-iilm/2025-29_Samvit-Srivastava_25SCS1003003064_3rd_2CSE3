[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weblens"
version = "1.0.0"
description = "Dependency-free web server access-log analyzer with anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Samvit Srivastava" }]
keywords = ["logs", "access-log", "analytics", "anomaly-detection", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: System :: Logging",
]
dependencies = []

[project.scripts]
weblens = "weblens.cli:main"

[tool.setuptools]
packages = ["weblens"]
