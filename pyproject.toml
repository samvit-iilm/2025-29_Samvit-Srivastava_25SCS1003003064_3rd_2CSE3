[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker"
version = "1.0.0"
description = "A simple command-line expense tracker with JSON storage"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Samvit Srivastava" }]
keywords = ["expenses", "budget", "cli", "json"]
dependencies = []

[project.scripts]
expense-tracker = "expense_tracker.cli:main"

[tool.setuptools]
packages = ["expense_tracker"]
